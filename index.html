<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杭州相亲帮帮 · 群组匹配</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --primary: #ec4899;
    --primary-light: #fce7f3;
    --primary-dark: #be185d;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #fdf2f8 0%, #ffffff 100%);
    min-height: 100vh;
    padding-bottom: 80px;
  }
  .score-ring {
    background: conic-gradient(var(--primary) var(--p, 0%), #fce7f3 var(--p, 0%));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .score-ring-inner {
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .tab-active { color: var(--primary); border-bottom: 2px solid var(--primary); }
  .tab-inactive { color: #6b7280; }
  .photo-slot {
    aspect-ratio: 3/4;
    background: #fce7f3;
    border: 2px dashed #f9a8d4;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ec4899;
    font-size: 24px;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
  .photo-slot .remove {
    position: absolute;
    top: 4px; right: 4px;
    background: rgba(0,0,0,0.5);
    color: white;
    border-radius: 50%;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .quiz-option {
    border: 2px solid #f3f4f6;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    background: white;
  }
  .quiz-option:hover { border-color: #f9a8d4; }
  .quiz-option.selected {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .rec-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(236, 72, 153, 0.08);
    overflow: hidden;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
  }
  .btn-primary {
    background: var(--primary);
    color: white;
    border-radius: 999px;
    padding: 12px 24px;
    font-weight: 600;
    width: 100%;
    text-align: center;
    transition: all 0.2s;
  }
  .btn-primary:active { background: var(--primary-dark); transform: scale(0.98); }
  .btn-primary:disabled { background: #d1d5db; color: #9ca3af; }
  .btn-secondary {
    background: var(--primary-light);
    color: var(--primary-dark);
    border-radius: 999px;
    padding: 12px 24px;
    font-weight: 600;
    width: 100%;
    text-align: center;
  }
  .btn-ghost {
    background: white;
    color: var(--primary);
    border: 1.5px solid var(--primary);
    border-radius: 999px;
    padding: 10px 20px;
    font-weight: 600;
  }
  .input-field {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    font-size: 16px;
    background: white;
    transition: border-color 0.2s;
  }
  .input-field:focus { outline: none; border-color: var(--primary); }
  .label-text { font-size: 14px; color: #6b7280; margin-bottom: 6px; display: block; font-weight: 500; }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #9ca3af;
  }
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 999;
    animation: slideUp 0.3s;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translate(-50%, 20px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    border-top: 1px solid #f3f4f6;
    display: flex;
    padding: 8px 0;
    padding-bottom: env(safe-area-inset-bottom, 8px);
    z-index: 50;
  }
  .tab-item {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 12px;
  }
  .tab-icon { font-size: 22px; display: block; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>

<script>
// ============== 颜值评分 10 题 ==============
const FACE_QUESTIONS = [
  { id: 1, key: 'face',     text: '你的五官协调度？',
    options: [
      { label: '有明显缺陷（歪、不对称、有较严重五官问题）', score: 2 },
      { label: '五官端正，无硬伤', score: 6 },
      { label: '五官精致协调，有记忆点', score: 10 }
    ]},
  { id: 2, key: 'skin',     text: '你的皮肤状态？',
    options: [
      { label: '皮肤粗糙 / 明显瑕疵', score: 2 },
      { label: '皮肤状态一般', score: 6 },
      { label: '皮肤光滑细腻', score: 10 }
    ]},
  { id: 3, key: 'bone',     text: '你的脸型 / 骨相？',
    options: [
      { label: '脸型偏大 / 骨相普通', score: 2 },
      { label: '标准脸型', score: 6 },
      { label: '小脸 / 上镜脸', score: 10 }
    ]},
  { id: 4, key: 'body',     text: '你的身材比例？',
    options: [
      { label: '身材比例不佳', score: 2 },
      { label: '比例正常', score: 6 },
      { label: '比例优越', score: 10 }
    ]},
  { id: 5, key: 'aura',     text: '你的气质气场？',
    options: [
      { label: '气质普通', score: 2 },
      { label: '气质端正', score: 6 },
      { label: '气质出众 / 有记忆点', score: 10 }
    ]},
  { id: 6, key: 'style',    text: '你的穿搭品味？',
    options: [
      { label: '穿搭随意', score: 2 },
      { label: '穿搭得体', score: 6 },
      { label: '穿搭有品味 / 出彩', score: 10 }
    ]},
  { id: 7, key: 'grooming', text: '你的妆发管理？',
    options: [
      { label: '不修边幅', score: 2 },
      { label: '基本打理', score: 6 },
      { label: '精致妆发', score: 10 }
    ]},
  { id: 8, key: 'recall',   text: '你的辨识度 / 记忆点？',
    options: [
      { label: '路人脸', score: 2 },
      { label: '有一定辨识度', score: 6 },
      { label: '过目不忘', score: 10 }
    ]},
  { id: 9, key: 'photo',    text: '你的表情管理 / 镜头感？',
    options: [
      { label: '拍照容易僵', score: 2 },
      { label: '自然得体', score: 6 },
      { label: '镜头感强 / 有感染力', score: 10 }
    ]},
  { id:10, key: 'overall',  text: '综合路人评价？',
    options: [
      { label: '不会引起注意', score: 2 },
      { label: '小美女 / 小帅哥水平', score: 6 },
      { label: '公认的美女 / 帅哥', score: 10 }
    ]}
];

// ============== 中国省份-城市（江浙沪为主） ==============
const REGIONS = [
  { province: '浙江', cities: ['杭州', '宁波', '温州', '嘉兴', '湖州', '绍兴', '金华', '衢州', '舟山', '台州', '丽水'] },
  { province: '江苏', cities: ['南京', '苏州', '无锡', '常州', '镇江', '南通', '扬州', '盐城', '徐州', '淮安', '连云港', '宿迁', '泰州'] },
  { province: '上海', cities: ['上海'] },
  { province: '安徽', cities: ['合肥', '芜湖', '蚌埠', '淮南', '马鞍山', '淮北', '铜陵', '安庆', '黄山', '滁州', '阜阳', '宿州', '六安', '亳州', '池州', '宣城'] },
  { province: '其他', cities: ['北京', '广东-广州', '广东-深圳', '福建-福州', '福建-厦门', '湖北-武汉', '湖南-长沙', '四川-成都'] }
];

// ============== 状态管理 ==============
const State = {
  screen: 'home',          // home | form | quiz | result | recommend | sync | settings | leader
  isLeader: false,
  profile: null,           // 我的资料
  groupData: [],           // 群数据
  quizIndex: 0,
  quizAnswers: [],
  lastForm: null,          // 表单暂存
  requirements: null,      // 择偶要求
  groupMergedText: '',
  recommendations: null,
  seenIds: [],
};

const LS_KEYS = {
  profile: 'xqbb_profile',
  groupData: 'xqbb_group',
  seenIds: 'xqbb_seen',
  lastReset: 'xqbb_lastreset'
};

function loadState() {
  try {
    State.profile = JSON.parse(localStorage.getItem(LS_KEYS.profile) || 'null');
    State.groupData = JSON.parse(localStorage.getItem(LS_KEYS.groupData) || '[]');
    State.seenIds = JSON.parse(localStorage.getItem(LS_KEYS.seenIds) || '[]');
  } catch(e) { console.error(e); }
  resetSeenIfNewDay();
}

function saveProfile() {
  localStorage.setItem(LS_KEYS.profile, JSON.stringify(State.profile));
}
function saveGroupData() {
  localStorage.setItem(LS_KEYS.groupData, JSON.stringify(State.groupData));
}
function saveSeen() {
  localStorage.setItem(LS_KEYS.seenIds, JSON.stringify(State.seenIds));
}

function resetSeenIfNewDay() {
  const today = new Date().toDateString();
  if (localStorage.getItem(LS_KEYS.lastReset) !== today) {
    State.seenIds = [];
    saveSeen();
    localStorage.setItem(LS_KEYS.lastReset, today);
  }
}

// ============== 工具函数 ==============
function uid() {
  return 'p_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
}

function showToast(msg, duration = 1800) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), duration);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制到剪贴板');
  }
}

function calcFaceScore(answers) {
  // answers 是 10 个 score 数字
  const total = answers.reduce((s, x) => s + x, 0);
  return Math.round(total / 10 * 10) / 10;  // 1 位小数
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============== 匹配逻辑 ==============
function getRecommendations() {
  if (!State.profile) return [];
  resetSeenIfNewDay();
  const r = State.profile.requirement;
  const me = State.profile;
  const candidates = State.groupData.filter(p => {
    if (p.id === me.id) return false;
    if (State.seenIds.includes(p.id)) return false;
    if (p.gender !== r.gender) return false;
    if (p.age < r.ageMin || p.age > r.ageMax) return false;
    if (p.height < r.heightMin || p.height > r.heightMax) return false;
    if ((p.faceScore || 0) < (r.faceScoreMin || 0)) return false;
    if (!r.hometowns || r.hometowns.length === 0) return true;
    if (!r.hometowns.includes(p.hometown)) return false;
    return true;
  });
  const picked = shuffle(candidates).slice(0, 5);
  State.seenIds = [...State.seenIds, ...picked.map(p => p.id)];
  saveSeen();
  return picked;
}

// ============== 渲染 ==============
function render() {
  const app = document.getElementById('app');
  if (State.isLeader) {
    app.innerHTML = renderLeader();
    bindLeader();
    return;
  }
  let main = '';
  switch (State.screen) {
    case 'home':       main = renderHome(); break;
    case 'form':       main = renderForm(); break;
    case 'quiz':       main = renderQuiz(); break;
    case 'result':     main = renderResult(); break;
    case 'recommend':  main = renderRecommend(); break;
    case 'sync':       main = renderSync(); break;
    case 'settings':   main = renderSettings(); break;
    default:           main = renderHome();
  }
  app.innerHTML = main + renderTabBar();
  bindScreen();
}

function renderTabBar() {
  const items = [
    { id: 'home',      icon: '🏠', label: '首页' },
    { id: 'recommend', icon: '💘', label: '推荐' },
    { id: 'sync',      icon: '🔄', label: '群数据' },
    { id: 'settings',  icon: '⚙️', label: '我的' }
  ];
  return `
    <div class="tab-bar">
      ${items.map(it => `
        <div class="tab-item ${State.screen === it.id ? 'tab-active' : 'tab-inactive'}" data-screen="${it.id}">
          <span class="tab-icon">${it.icon}</span>
          ${it.label}
        </div>
      `).join('')}
    </div>`;
}

// ============== 各个 Screen ==============

function renderHome() {
  if (!State.profile) {
    return `
      <div class="px-5 pt-12">
        <div class="text-center mb-8">
          <div class="text-5xl mb-3">💖</div>
          <h1 class="text-2xl font-bold text-gray-800">杭州相亲帮帮</h1>
          <p class="text-sm text-gray-500 mt-2">群内破冰 · 颜值打分 · 智能匹配</p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
          <h3 class="font-bold text-gray-800 mb-3">📌 这是什么？</h3>
          <p class="text-sm text-gray-600 leading-relaxed">
            群主在「相亲帮帮群」里收集大家的资料和颜值评分，
            每天给每人推荐 5 个符合要求的群友。
            零外部服务器，全部数据存在你手机本地。
          </p>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-sm mb-6">
          <h3 class="font-bold text-gray-800 mb-3">✨ 怎么用？</h3>
          <ol class="text-sm text-gray-600 leading-relaxed space-y-2">
            <li>1️⃣ 填写你的资料（昵称、身高、老家、照片）</li>
            <li>2️⃣ 完成 10 题颜值自评（约 1 分钟）</li>
            <li>3️⃣ 复制你的资料发到群里</li>
            <li>4️⃣ 导入群主的合并数据，看推荐</li>
          </ol>
        </div>
        <button class="btn-primary" data-act="go-form">开始填写资料 →</button>
        <div class="text-center mt-3">
          <button class="text-sm text-pink-500" data-act="toggle-leader">我是群主</button>
        </div>
      </div>
    `;
  }
  // 已填资料
  const p = State.profile;
  return `
    <div class="px-5 pt-8">
      <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
        <div class="flex items-center gap-4">
          <div class="score-ring" style="width:80px;height:80px;--p:${(p.faceScore/10)*360}deg">
            <div class="score-ring-inner" style="width:64px;height:64px">
              <div class="text-xl font-bold text-pink-500">${p.faceScore.toFixed(1)}</div>
              <div class="text-[10px] text-gray-400">颜值分</div>
            </div>
          </div>
          <div class="flex-1">
            <div class="font-bold text-lg text-gray-800">${p.nickname}</div>
            <div class="text-sm text-gray-500 mt-1">
              ${p.gender === 'female' ? '♀' : '♂'} · ${p.age}岁 · ${p.height}cm
            </div>
            <div class="text-sm text-gray-500">📍 ${p.hometown}</div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 mb-4">
        <button class="btn-secondary" data-act="go-form">📝 编辑资料</button>
        <button class="btn-secondary" data-act="copy-me">📤 复制我的资料</button>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
        <h3 class="font-bold text-gray-800 mb-3">🎯 择偶要求</h3>
        <div class="text-sm text-gray-600 space-y-1">
          <div>性别：${p.requirement.gender === 'male' ? '男' : '女'}</div>
          <div>年龄：${p.requirement.ageMin} - ${p.requirement.ageMax} 岁</div>
          <div>身高：${p.requirement.heightMin} - ${p.requirement.heightMax} cm</div>
          <div>老家：${p.requirement.hometowns.join(' / ')}</div>
          <div>颜值分：≥ ${p.requirement.faceScoreMin} 分</div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
        <h3 class="font-bold text-gray-800 mb-2">📊 群数据状态</h3>
        <div class="text-sm text-gray-600">群内已导入 <b class="text-pink-500">${State.groupData.length}</b> 位（含你）</div>
        <div class="text-xs text-gray-400 mt-1">今天已推荐：${State.seenIds.length} 位</div>
      </div>

      <button class="btn-primary" data-act="go-recommend">💘 查看今日 5 个推荐</button>
    </div>
  `;
}

function renderForm() {
  const p = State.profile || {};
  const r = p.requirement || {
    gender: 'male', ageMin: 25, ageMax: 32, heightMin: 170, heightMax: 195,
    hometowns: ['浙江-杭州', '浙江-宁波', '江苏-南京', '上海'], faceScoreMin: 5
  };
  return `
    <div class="px-5 pt-6">
      <div class="flex items-center mb-5">
        <button class="text-2xl text-gray-500" data-act="back">←</button>
        <h2 class="text-lg font-bold text-gray-800 ml-3">填写资料</h2>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
        <div class="mb-4">
          <label class="label-text">昵称（群里显示用）</label>
          <input class="input-field" id="f-nickname" value="${p.nickname||''}" placeholder="例如：杭州小美" maxlength="12">
        </div>
        <div class="mb-4">
          <label class="label-text">微信号（方便群里 @你）</label>
          <input class="input-field" id="f-wechat" value="${p.wechat||''}" placeholder="可选，填了方便联系">
        </div>
        <div class="mb-4">
          <label class="label-text">性别</label>
          <div class="grid grid-cols-2 gap-2">
            <div class="quiz-option ${(p.gender||'female')==='female'?'selected':''}" data-radio="gender" data-val="female">♀ 女</div>
            <div class="quiz-option ${(p.gender||'female')==='male'?'selected':''}" data-radio="gender" data-val="male">♂ 男</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div>
            <label class="label-text">年龄</label>
            <input class="input-field" type="number" id="f-age" value="${p.age||26}" min="18" max="60">
          </div>
          <div>
            <label class="label-text">身高 (cm)</label>
            <input class="input-field" type="number" id="f-height" value="${p.height||165}" min="140" max="220">
          </div>
        </div>
        <div class="mb-4">
          <label class="label-text">老家（省-市）</label>
          <select class="input-field" id="f-hometown">
            ${REGIONS.map(reg => `<optgroup label="${reg.province}">${reg.cities.map(c => `<option value="${reg.province}-${c}" ${p.hometown===reg.province+'-'+c?'selected':''}>${reg.province}-${c}</option>`).join('')}</optgroup>`).join('')}
          </select>
        </div>
        <div class="mb-2">
          <label class="label-text">3 张照片链接（小红书/网盘/微信相册链接）</label>
          <div class="grid grid-cols-3 gap-2" id="photo-grid">
            ${[0,1,2].map(i => {
              const url = (p.photos||[])[i] || '';
              return `<div class="photo-slot" data-photo="${i}">
                ${url ? `<img src="${url}"><div class="remove" data-rm-photo="${i}">×</div>` : '<span>+</span>'}
              </div>`;
            }).join('')}
          </div>
          <div class="text-xs text-gray-400 mt-2">点击格子粘贴图片链接（建议公开相册直链）</div>
        </div>
      </div>

      <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
        <h3 class="font-bold text-gray-800 mb-3">🎯 择偶要求</h3>
        <div class="mb-4">
          <label class="label-text">期望对方性别</label>
          <div class="grid grid-cols-2 gap-2">
            <div class="quiz-option ${r.gender==='female'?'selected':''}" data-radio="r-gender" data-val="female">♀ 女</div>

// ============== 事件绑定 ==============
function bindScreen() {
  // Tab bar
  document.querySelectorAll('[data-screen]').forEach(el => {
    el.onclick = () => {
      State.screen = el.dataset.screen;
      render();
    };
  });
  // 用赋值避免重复绑定
  document.body.onclick = onClick;
}

function onClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) { bindScreen(); return; }
  const act = t.dataset.act;
  switch (act) {
    case 'go-home':      State.screen = 'home'; break;
    case 'go-form':      State.screen = 'form'; break;
    case 'go-quiz':      State.quizIndex = 0; State.quizAnswers = State.profile ? State.profile.faceAnswers || [] : []; State.screen = 'quiz'; break;
    case 'go-recommend': State.screen = 'recommend'; break;
    case 'goto-sync':    State.screen = 'sync'; break;
    case 'goto-settings':State.screen = 'settings'; break;
    case 'back':         State.screen = State.profile ? 'home' : 'home'; break;
    case 'quiz-back':    if (State.quizIndex > 0) State.quizIndex--; else State.screen = 'form'; break;
    case 'form-next':    collectForm(); if (State.profile) { State.quizIndex = 0; State.quizAnswers = []; State.screen = 'quiz'; } break;
    case 'quiz-next':    onQuizNext(); break;
    case 'copy-me':      copyMyProfile(); break;
    case 'import-group': importGroupData(); break;
    case 'export-all':   exportAllData(); break;
    case 'reset-all':    if (confirm('确定清空所有数据？此操作不可恢复。')) { localStorage.clear(); location.reload(); } break;
    case 'toggle-leader':State.isLeader = !State.isLeader; break;
  }
  render();
}

function collectForm() {
  const nickname = document.getElementById('f-nickname').value.trim();
  if (!nickname) { showToast('请填写昵称'); return; }
  const wechat = document.getElementById('f-wechat').value.trim();
  const age = parseInt(document.getElementById('f-age').value);
  const height = parseInt(document.getElementById('f-height').value);
  const hometown = document.getElementById('f-hometown').value;
  const gender = (document.querySelector('[data-radio="gender"].selected') || {}).dataset?.val || 'female';
  const rGender = (document.querySelector('[data-radio="r-gender"].selected') || {}).dataset?.val || 'male';
  const ageMin = parseInt(document.getElementById('r-ageMin').value);
  const ageMax = parseInt(document.getElementById('r-ageMax').value);
  const hMin = parseInt(document.getElementById('r-hMin').value);
  const hMax = parseInt(document.getElementById('r-hMax').value);
  const faceMin = parseFloat(document.getElementById('r-faceMin').value);
  const hometowns = [...document.querySelectorAll('[data-toggle-ht].selected')].map(el => el.dataset.toggleHt);

  // 照片
  const photos = State.profile?.photos || ['', '', ''];

  State.profile = {
    id: State.profile?.id || uid(),
    nickname, wechat, gender, age, height, hometown,
    photos,
    requirement: { gender: rGender, ageMin, ageMax, heightMin: hMin, heightMax: hMax, hometowns, faceScoreMin: faceMin },
    faceScore: State.profile?.faceScore || 0,
    faceAnswers: State.profile?.faceAnswers || [],
    filledAt: State.profile?.filledAt || new Date().toISOString()
  };
  saveProfile();
  // 同步到群数据
  syncProfileToGroup();
}

function onQuizNext() {
  const i = State.quizIndex;
  const optIdx = [...document.querySelectorAll('[data-quiz-opt]')].findIndex(el => el.classList.contains('selected'));
  if (optIdx < 0) { showToast('请选择一个选项'); return; }
  State.quizAnswers[i] = FACE_QUESTIONS[i].options[optIdx].score;
  if (i < FACE_QUESTIONS.length - 1) {
    State.quizIndex++;
  } else {
    // 完成
    State.profile.faceAnswers = State.quizAnswers;
    State.profile.faceScore = calcFaceScore(State.quizAnswers);
    saveProfile();
    syncProfileToGroup();
    State.screen = 'result';
  }
}

function copyMyProfile() {
  if (!State.profile) { showToast('请先填写资料'); return; }
  const data = JSON.stringify([State.profile], null, 2);
  copyToClipboard(data);
}

function syncProfileToGroup() {
  if (!State.profile) return;
  const idx = State.groupData.findIndex(p => p.id === State.profile.id);
  if (idx >= 0) State.groupData[idx] = State.profile;
  else State.groupData.push(State.profile);
  saveGroupData();
}

function importGroupData() {
  const text = document.getElementById('import-text').value.trim();
  if (!text) { showToast('请先粘贴 JSON'); return; }
  try {
    let arr;
    // 支持纯 JSON 或带 "复制我的资料" 周围文本的截取
    const m = text.match(/\[\s*\{[\s\S]*?\}\s*\]/);
    const json = m ? m[0] : text;
    arr = JSON.parse(json);
    if (!Array.isArray(arr)) throw new Error('不是数组');
    let added = 0, updated = 0;
    arr.forEach(p => {
      if (!p.id) p.id = uid();
      const i = State.groupData.findIndex(x => x.id === p.id);
      if (i >= 0) { State.groupData[i] = p; updated++; }
      else { State.groupData.push(p); added++; }
    });
    saveGroupData();
    showToast(`✅ 导入成功 · 新增 ${added}，更新 ${updated}`);
    document.getElementById('import-text').value = '';
  } catch(e) {
    showToast('❌ JSON 格式不对：' + e.message);
  }
}

function exportAllData() {
  copyToClipboard(JSON.stringify(State.groupData, null, 2));
}

// ============== 群主模式事件 ==============
function bindLeader() {
  document.body.onclick = onLeaderClick;
}

function onLeaderClick(e) {
  const t = e.target.closest('[data-act]');
  if (!t) { bindLeader(); return; }
  const act = t.dataset.act;
  if (act === 'leader-merge') {
    const text = document.getElementById('leader-input').value.trim();
    if (!text) { showToast('请先粘贴 JSON'); bindLeader(); return; }
    try {
      const m = text.match(/\[\s*\{[\s\S]*?\}\s*\]/);
      const json = m ? m[0] : text;
      const arr = JSON.parse(json);
      let added = 0, updated = 0;
      arr.forEach(p => {
        if (!p.id) p.id = uid();
        const i = State.groupData.findIndex(x => x.id === p.id);
        if (i >= 0) { State.groupData[i] = p; updated++; }
        else { State.groupData.push(p); added++; }
      });
      saveGroupData();
      document.getElementById('leader-input').value = '';
      showToast(`✅ 合并成功 · 新增 ${added}，更新 ${updated}`);
    } catch(e) {
      showToast('❌ JSON 格式不对');
    }
  } else if (act === 'leader-export') {
    copyToClipboard(JSON.stringify(State.groupData, null, 2));
  } else if (act === 'leader-clear') {
    if (confirm('确定清空群数据？')) {
      State.groupData = [];
      saveGroupData();
      showToast('已清空');
    }
  } else if (act === 'leader-list') {
    const list = State.groupData.map(p => `${p.nickname} | ${p.gender==='female'?'女':'男'} | ${p.age}岁 | ${p.height}cm | ${p.hometown} | 颜值${(p.faceScore||0).toFixed(1)}`).join('\n');
    alert(`群内 ${State.groupData.length} 人：\n\n${list}`);
  } else if (act === 'toggle-leader') {
    State.isLeader = false;
  }
  render();
}

// ============== 内部事件代理（表单交互） ==============
document.addEventListener('click', function(e) {
  // radio 单选
  const radio = e.target.closest('[data-radio]');
  if (radio) {
    document.querySelectorAll(`[data-radio="${radio.dataset.radio}"]`).forEach(el => el.classList.remove('selected'));
    radio.classList.add('selected');
    return;
  }
  // 老家多选
  const ht = e.target.closest('[data-toggle-ht]');
  if (ht) {
    ht.classList.toggle('selected');
    return;
  }
  // 颜值题选项
  const qo = e.target.closest('[data-quiz-opt]');
  if (qo) {
    document.querySelectorAll('[data-quiz-opt]').forEach(el => el.classList.remove('selected'));
    qo.classList.add('selected');
    // 启用按钮
    const btn = document.querySelector('[data-act="quiz-next"]');
    if (btn) btn.disabled = false;
    return;
  }
  // 照片格子
  const ph = e.target.closest('[data-photo]');
  if (ph) {
    const i = parseInt(ph.dataset.photo);
    const url = prompt('粘贴图片链接（小红书/网盘/微信相册公开直链）', (State.profile?.photos||[])[i] || '');
    if (url !== null) {
      if (!State.profile) State.profile = { id: uid(), requirement: {} };
      if (!State.profile.photos) State.profile.photos = ['','',''];
      State.profile.photos[i] = url;
      saveProfile();
      render();
    }
    return;
  }
  // 照片删除
  const rm = e.target.closest('[data-rm-photo]');
  if (rm) {
    e.stopPropagation();
    const i = parseInt(rm.dataset.rmPhoto);
    if (State.profile?.photos) {
      State.profile.photos[i] = '';
      saveProfile();
      render();
    }
    return;
  }
});

// ============== 启动 ==============
loadState();
render();
</script>
</body>
</html>

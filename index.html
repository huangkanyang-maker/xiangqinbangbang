<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杭州相亲帮帮 · 群组匹配</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --primary:#ec4899; --primary-light:#fce7f3; --primary-dark:#be185d; }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; background:linear-gradient(180deg,#fdf2f8 0%,#fff 100%); min-height:100vh; padding-bottom:80px; }
  .score-ring { background:conic-gradient(var(--primary) var(--p,0%),#fce7f3 var(--p,0%)); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .score-ring-inner { background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .tab-active { color:var(--primary); border-bottom:2px solid var(--primary); }
  .tab-inactive { color:#6b7280; }
  .photo-slot { aspect-ratio:3/4; background:#fce7f3; border:2px dashed #f9a8d4; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#ec4899; font-size:24px; cursor:pointer; overflow:hidden; position:relative; }
  .photo-slot img { width:100%; height:100%; object-fit:cover; }
  .photo-slot .remove { position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.5); color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .quiz-option { border:2px solid #f3f4f6; border-radius:12px; padding:12px 16px; cursor:pointer; transition:all .2s; background:#fff; }
  .quiz-option:hover { border-color:#f9a8d4; }
  .quiz-option.selected { border-color:var(--primary); background:var(--primary-light); }
  .rec-card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(236,72,153,.08); overflow:hidden; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:500; }
  .btn-primary { background:var(--primary); color:#fff; border-radius:999px; padding:12px 24px; font-weight:600; width:100%; text-align:center; transition:all .2s; }
  .btn-primary:active { background:var(--primary-dark); transform:scale(.98); }
  .btn-primary:disabled { background:#d1d5db; color:#9ca3af; }
  .btn-secondary { background:var(--primary-light); color:var(--primary-dark); border-radius:999px; padding:12px 24px; font-weight:600; width:100%; text-align:center; }
  .btn-ghost { background:#fff; color:var(--primary); border:1.5px solid var(--primary); border-radius:999px; padding:10px 20px; font-weight:600; }
  .input-field { width:100%; padding:12px 16px; border:1.5px solid #e5e7eb; border-radius:12px; font-size:16px; background:#fff; transition:border-color .2s; }
  .input-field:focus { outline:none; border-color:var(--primary); }
  .label-text { font-size:14px; color:#6b7280; margin-bottom:6px; display:block; font-weight:500; }
  .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; padding:10px 20px; border-radius:999px; font-size:14px; z-index:999; animation:slideUp .3s; }
  @keyframes slideUp { from{opacity:0;transform:translate(-50%,20px);} to{opacity:1;transform:translate(-50%,0);} }
  .tab-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #f3f4f6; display:flex; padding:8px 0; padding-bottom:env(safe-area-inset-bottom,8px); z-index:50; }
  .tab-item { flex:1; text-align:center; padding:8px 0; font-size:12px; }
  .tab-icon { font-size:22px; display:block; }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:200; }
  .modal-box { background:#fff; border-radius:16px; padding:24px; width:90%; max-width:360px; }
  .tag-chip { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; border:1.5px solid #e5e7eb; cursor:pointer; font-size:13px; background:#fff; }
  .tag-chip.selected { border-color:var(--primary); background:var(--primary-light); color:var(--primary-dark); }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container"></div>
  <input type="file" id="photo-input" accept="image/*" style="display:none">

<script>
// ============== 全国省份（只到省） ==============
const REGIONS = ['北京','上海','天津','重庆','河北','山西','内蒙古','辽宁','吉林','黑龙江','江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南','广东','广西','海南','四川','贵州','云南','西藏','陕西','甘肃','青海','宁夏','新疆','香港','澳门','台湾'];

const CONTACT_TYPES = [
  { key: 'douyin', label: '抖音' },
  { key: 'xiaohongshu', label: '小红书' },
  { key: 'wechat', label: '微信' }
];

// ============== 状态 ==============
const State = {
  screen: 'home', isLeader: false,
  profile: null, groupData: [], seenIds: [],
  groupPassword: null, baiduApiKey: null, baiduSecretKey: null,
  tempPhotos: [], tempContactType: 'douyin'
};
const LS_KEYS = {
  profile:'xqbb_profile', groupData:'xqbb_group', seenIds:'xqbb_seen',
  lastReset:'xqbb_lastreset', password:'xqbb_password',
  baiduKey:'xqbb_baidu_key', baiduSecret:'xqbb_baidu_secret'
};

function loadState() {
  try {
    State.profile = JSON.parse(localStorage.getItem(LS_KEYS.profile) || 'null');
    State.groupData = JSON.parse(localStorage.getItem(LS_KEYS.groupData) || '[]');
    State.seenIds = JSON.parse(localStorage.getItem(LS_KEYS.seenIds) || '[]');
    State.groupPassword = localStorage.getItem(LS_KEYS.password) || null;
    State.baiduApiKey = localStorage.getItem(LS_KEYS.baiduKey) || 'Za16WJNHqXZYpbHq4hwxAY6R';
    State.baiduSecretKey = localStorage.getItem(LS_KEYS.baiduSecret) || 'qOrmHSwWPT5WYt9xuCtFsOkiPlH37rLK';
  } catch(e) { console.error(e); }
  resetSeenIfNewDay();
}
function saveProfile() { localStorage.setItem(LS_KEYS.profile, JSON.stringify(State.profile)); }
function saveGroupData() { localStorage.setItem(LS_KEYS.groupData, JSON.stringify(State.groupData)); }
function saveSeen() { localStorage.setItem(LS_KEYS.seenIds, JSON.stringify(State.seenIds)); }
function resetSeenIfNewDay() {
  const today = new Date().toDateString();
  if (localStorage.getItem(LS_KEYS.lastReset) !== today) {
    State.seenIds = []; saveSeen(); localStorage.setItem(LS_KEYS.lastReset, today);
  }
}

// ============== 工具 ==============
function uid() { return 'p_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function showToast(msg, duration=1800) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  c.appendChild(t); setTimeout(()=>t.remove(), duration);
}
function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板'), ()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('已复制到剪贴板');
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function contactLabel(t){ const f=CONTACT_TYPES.find(c=>c.key===t); return f?f.label:t; }

// ============== 照片压缩 ==============
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => showToast('图片读取失败');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ============== AI 颜值打分（百度 AI） ==============
async function getBaiduToken() {
  const key=State.baiduApiKey, secret=State.baiduSecretKey;
  if(!key || !secret) throw new Error('NO_KEY');
  const url = `https://aip.baidubce.com/oauth/2.0/token?grant_type=client_credentials&client_id=${encodeURIComponent(key)}&client_secret=${encodeURIComponent(secret)}`;
  const res = await fetch(url, { method:'POST' });
  const data = await res.json();
  if(data.access_token) return data.access_token;
  throw new Error(data.error_description || 'token获取失败');
}
async function detectFace(base64DataUrl) {
  const token = await getBaiduToken();
  const url = `https://aip.baidubce.com/rest/2.0/face/v3/detect?access_token=${token}`;
  const pure = base64DataUrl.replace(/^data:image\/\w+;base64,/, '');
  for (let attempt = 0; attempt < 3; attempt++) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: pure, image_type: 'BASE64', face_field: 'beauty,age,gender' })
    });
    const data = await res.json();
    if (data.error_code === 0 && data.result && data.result.face_num > 0) {
      const face = data.result.face_list[0];
      return { beauty: face.beauty, age: face.age, gender: face.gender ? face.gender.type : null };
    }
    if (data.error_code === 18) { // QPS 超限，等待后重试
      await new Promise(r => setTimeout(r, 1500));
      continue;
    }
    throw new Error(data.error_msg || '未检测到清晰人脸');
  }
  throw new Error('请求过于频繁，请稍后再试');
}

// ============== 匹配 ==============
function getRecommendations() {
  if(!State.profile) return [];
  resetSeenIfNewDay();
  const r=State.profile.requirement, me=State.profile;
  const candidates = State.groupData.filter(p => {
    if(p.id===me.id) return false;
    if(State.seenIds.includes(p.id)) return false;
    if(p.gender!==r.gender) return false;
    if(p.age<r.ageMin || p.age>r.ageMax) return false;
    if(p.height<r.heightMin || p.height>r.heightMax) return false;
    if((p.faceScore||0) < (r.faceScoreMin||0)) return false;
    if(r.hometowns && r.hometowns.length>0 && !r.hometowns.includes(p.hometown)) return false;
    return true;
  });
  const picked = shuffle(candidates).slice(0,5);
  State.seenIds = [...State.seenIds, ...picked.map(p=>p.id)];
  saveSeen();
  return picked;
}

// ============== 渲染 ==============
function render() {
  const app = document.getElementById('app');
  if(State.isLeader) { app.innerHTML = renderLeader(); bindLeader(); return; }
  let main='';
  switch(State.screen) {
    case 'home': main=renderHome(); break;
    case 'form': main=renderForm(); break;
    case 'quiz': main=renderQuiz(); break;
    case 'result': main=renderResult(); break;
    case 'recommend': main=renderRecommend(); break;
    case 'sync': main=renderSync(); break;
    case 'settings': main=renderSettings(); break;
    default: main=renderHome();
  }
  app.innerHTML = main + renderTabBar();
  bindScreen();
}
function renderTabBar() {
  const items=[['home','🏠','首页'],['recommend','💘','推荐'],['sync','🔄','群数据'],['settings','⚙️','我的']];
  return `<div class="tab-bar">${items.map(it=>`<div class="tab-item ${State.screen===it[0]?'tab-active':'tab-inactive'}" data-screen="${it[0]}"><span class="tab-icon">${it[1]}</span>${it[2]}</div>`).join('')}</div>`;
}

// ============== 首页 ==============
function renderHome() {
  if(!State.profile) {
    return `<div class="px-5 pt-12">
      <div class="text-center mb-8"><div class="text-5xl mb-3">💖</div><h1 class="text-2xl font-bold text-gray-800">杭州相亲帮帮</h1><p class="text-sm text-gray-500 mt-2">上传照片 · AI 颜值打分 · 每日匹配</p></div>
      <div class="bg-white rounded-2xl p-5 shadow-sm mb-4"><h3 class="font-bold text-gray-800 mb-3">📌 这是什么？</h3><p class="text-sm text-gray-600 leading-relaxed">群主在「相亲帮帮群」收集资料，AI 给颜值客观打分，每天给你推荐 5 个符合条件的群友。</p></div>
      <div class="bg-white rounded-2xl p-5 shadow-sm mb-6"><h3 class="font-bold text-gray-800 mb-3">✨ 怎么用？</h3><ol class="text-sm text-gray-600 leading-relaxed space-y-2"><li>1️⃣ 填资料 + 上传照片</li><li>2️⃣ AI 系统打分（客观颜值分）</li><li>3️⃣ 复制资料发到群里</li><li>4️⃣ 导入群数据，看每日推荐</li></ol></div>
      <button class="btn-primary" data-act="go-form">开始填写资料 →</button>
    </div>`;
  }
  const p = State.profile;
  return `<div class="px-5 pt-8">
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
      <div class="flex items-center gap-4">
        <div class="score-ring" style="width:80px;height:80px;--p:${((p.faceScore||0)/10)*360}deg"><div class="score-ring-inner" style="width:64px;height:64px"><div class="text-xl font-bold text-pink-500">${p.faceScore?p.faceScore.toFixed(1):'-'}</div><div class="text-[10px] text-gray-400">颜值分</div></div></div>
        <div class="flex-1">
          <div class="font-bold text-lg text-gray-800">${p.nickname}</div>
          <div class="text-sm text-gray-500 mt-1">${p.gender==='female'?'♀':'♂'} · ${p.age}岁 · ${p.height}cm</div>
          <div class="text-sm text-gray-500">📍 ${p.hometown}</div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <button class="btn-secondary" data-act="go-form">📝 编辑资料</button>
      <button class="btn-secondary" data-act="copy-me">📤 复制我的资料</button>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4"><h3 class="font-bold text-gray-800 mb-3">🎯 择偶要求</h3><div class="text-sm text-gray-600 space-y-1"><div>性别：${p.requirement.gender==='male'?'男':'女'}</div><div>年龄：${p.requirement.ageMin} - ${p.requirement.ageMax} 岁</div><div>身高：${p.requirement.heightMin} - ${p.requirement.heightMax} cm</div><div>老家：${p.requirement.hometowns.length?p.requirement.hometowns.join(' / '):'不限'}</div><div>颜值分：≥ ${p.requirement.faceScoreMin} 分</div></div></div>
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4"><h3 class="font-bold text-gray-800 mb-2">📊 群数据状态</h3><div class="text-sm text-gray-600">群内已导入 <b class="text-pink-500">${State.groupData.length}</b> 位（含你）</div><div class="text-xs text-gray-400 mt-1">今天已推荐：${State.seenIds.length} 位</div></div>
    <button class="btn-primary" data-act="go-recommend">💘 查看今日 5 个推荐</button>
  </div>`;
}

// ============== 填写资料 ==============
function renderForm() {
  const p = State.profile || {};
  const r = p.requirement || { gender:'male', ageMin:25, ageMax:32, heightMin:170, heightMax:195, hometowns:[], faceScoreMin:5 };
  const photos = State.tempPhotos.length ? State.tempPhotos : (p.photos || []);
  const ct = State.tempContactType || p.contact?.type || 'douyin';
  const opts = REGIONS.map(rg=>`<option value="${rg}" ${p.hometown===rg?'selected':''}>${rg}</option>`).join('');
  return `<div class="px-5 pt-6">
    <div class="flex items-center mb-5"><button class="text-2xl text-gray-500" data-act="back">←</button><h2 class="text-lg font-bold text-gray-800 ml-3">填写资料</h2></div>
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
      <div class="mb-4"><label class="label-text">昵称（群里显示用）</label><input class="input-field" id="f-nickname" value="${p.nickname||''}" placeholder="例如：杭州小美" maxlength="12"></div>
      <div class="mb-4"><label class="label-text">性别</label><div class="grid grid-cols-2 gap-2"><div class="quiz-option ${(p.gender||'female')==='female'?'selected':''}" data-radio="gender" data-val="female">♀ 女</div><div class="quiz-option ${(p.gender||'female')==='male'?'selected':''}" data-radio="gender" data-val="male">♂ 男</div></div></div>
      <div class="grid grid-cols-2 gap-3 mb-4"><div><label class="label-text">年龄</label><input class="input-field" type="number" id="f-age" value="${p.age||26}" min="18" max="60"></div><div><label class="label-text">身高 (cm)</label><input class="input-field" type="number" id="f-height" value="${p.height||165}" min="140" max="220"></div></div>
      <div class="mb-4"><label class="label-text">老家（省）</label><select class="input-field" id="f-hometown">${opts}</select></div>
      <div class="mb-4"><label class="label-text">联系方式（选一种，填账号）</label><div class="flex gap-2 mb-2" id="contact-type">${CONTACT_TYPES.map(c=>`<div class="tag-chip ${ct===c.key?'selected':''}" data-radio="contact" data-val="${c.key}">${c.label}</div>`).join('')}</div><input class="input-field" id="f-contact-account" value="${p.contact?.account||''}" placeholder="填写对应账号（如抖音号 / 小红书号 / 微信号）"></div>
      <div class="mb-2"><label class="label-text">上传照片（用于 AI 颜值打分，建议正面清晰照）</label><div class="grid grid-cols-3 gap-2" id="photo-grid">${[0,1,2].map(i=>`<div class="photo-slot" data-photo="${i}">${photos[i]?`<img src="${photos[i]}"><div class="remove" data-rm-photo="${i}">×</div>`:'<span>+</span>'}</div>`).join('')}</div><div class="text-xs text-gray-400 mt-2">点击格子选择本地照片（自动压缩）</div></div>
    </div>
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4">
      <h3 class="font-bold text-gray-800 mb-3">🎯 择偶要求</h3>
      <div class="mb-4"><label class="label-text">期望对方性别</label><div class="grid grid-cols-2 gap-2"><div class="quiz-option ${r.gender==='female'?'selected':''}" data-radio="r-gender" data-val="female">♀ 女</div><div class="quiz-option ${r.gender==='male'?'selected':''}" data-radio="r-gender" data-val="male">♂ 男</div></div></div>
      <div class="grid grid-cols-2 gap-3 mb-4"><div><label class="label-text">年龄范围</label><div class="flex items-center gap-2"><input class="input-field" type="number" id="r-ageMin" value="${r.ageMin}" min="18" max="60"><span>-</span><input class="input-field" type="number" id="r-ageMax" value="${r.ageMax}" min="18" max="60"></div></div><div><label class="label-text">身高 (cm)</label><div class="flex items-center gap-2"><input class="input-field" type="number" id="r-hMin" value="${r.heightMin}" min="140" max="220"><span>-</span><input class="input-field" type="number" id="r-hMax" value="${r.heightMax}" min="140" max="220"></div></div></div>
      <div class="mb-4"><label class="label-text">最低颜值分</label><input class="input-field" type="number" id="r-faceMin" value="${r.faceScoreMin}" min="0" max="10" step="0.5"></div>
      <div class="mb-2"><label class="label-text">接受的老家（可多选，不选=不限）</label><div class="flex flex-wrap gap-2" id="r-hometowns">${REGIONS.map(h=>`<div class="tag-chip ${r.hometowns.includes(h)?'selected':''}" data-toggle-ht="${h}">${h}</div>`).join('')}</div></div>
    </div>
    <button class="btn-primary mb-3" data-act="form-next">下一步：AI 颜值打分 →</button>
    <button class="btn-ghost w-full" data-act="back">取消</button>
  </div>`;
}

// ============== AI 颜值打分 ==============
function renderQuiz() {
  const photos = State.tempPhotos.length ? State.tempPhotos : (State.profile?.photos || []);
  const hasPhoto = photos.length > 0 && photos[0];
  return `<div class="px-5 pt-6">
    <div class="flex items-center mb-5"><button class="text-2xl text-gray-500" data-act="back">←</button><h2 class="text-lg font-bold text-gray-800 ml-3">AI 颜值打分</h2></div>
    <div class="bg-white rounded-2xl p-5 shadow-sm mb-4 text-center">
      ${hasPhoto ? `<img src="${photos[0]}" class="w-40 h-52 object-cover rounded-xl mx-auto mb-4">` : `<div class="w-40 h-52 bg-pink-50 rounded-xl mx-auto mb-4 flex items-center justify-center text-pink-300 text-4xl">📷</div>`}
      <p class="text-sm text-gray-600 mb-3">${hasPhoto ? '将用这张照片进行 AI 客观打分' : '请先回到上一步上传照片'}</p>
      <div id="quiz-result"></div>
      <button class="btn-primary mt-3" id="quiz-start" data-act="quiz-start" ${hasPhoto?'':'disabled'}>🤖 开始系统打分</button>
      <p class="text-xs text-gray-400 mt-2">由 AI 人脸识别模型客观评分（0-100 分制换算）</p>
    </div>
    <button class="btn-ghost w-full" data-act="back">返回修改资料</button>
  </div>`;
}

// ============== 事件绑定 ==============
function bindScreen() {
  document.querySelectorAll('[data-screen]').forEach(el => {
    el.onclick = () => { State.screen = el.dataset.screen; render(); };
  });
  document.body.onclick = onClick;
}
function onClick(e) {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  switch(act) {
    case 'go-home': State.screen='home'; break;
    case 'go-form': State.tempPhotos = State.profile?.photos ? [...State.profile.photos] : []; State.screen='form'; break;
    case 'go-recommend': State.screen='recommend'; break;
    case 'goto-sync': State.screen='sync'; break;
    case 'goto-settings': State.screen='settings'; break;
    case 'back': State.screen='home'; break;
    case 'form-next': collectForm(); return;
    case 'quiz-start': startFaceScore(); return;
    case 'copy-me': copyMyProfile(); break;
    case 'import-group': importGroupData(); return;
    case 're-score': startReScore(); return;
    case 'leader-entry': openLeaderAuth(); return;
  }
  render();
}

// ============== 表单收集 ==============
function collectForm() {
  const nickname = document.getElementById('f-nickname').value.trim();
  if(!nickname) { showToast('请填写昵称'); return; }
  const age = parseInt(document.getElementById('f-age').value);
  const height = parseInt(document.getElementById('f-height').value);
  const hometown = document.getElementById('f-hometown').value;
  const gender = (document.querySelector('[data-radio="gender"].selected')||{}).dataset?.val || 'female';
  const ct = (document.querySelector('[data-radio="contact"].selected')||{}).dataset?.val || 'douyin';
  const contactAccount = document.getElementById('f-contact-account').value.trim();
  const rGender = (document.querySelector('[data-radio="r-gender"].selected')||{}).dataset?.val || 'male';
  const ageMin = parseInt(document.getElementById('r-ageMin').value);
  const ageMax = parseInt(document.getElementById('r-ageMax').value);
  const hMin = parseInt(document.getElementById('r-hMin').value);
  const hMax = parseInt(document.getElementById('r-hMax').value);
  const faceMin = parseFloat(document.getElementById('r-faceMin').value);
  const hometowns = [...document.querySelectorAll('[data-toggle-ht].selected')].map(el=>el.dataset.toggleHt);
  const photos = State.tempPhotos.length ? [...State.tempPhotos] : (State.profile?.photos || []);

  if(!photos.length) { showToast('请至少上传一张照片用于打分'); return; }

  State.profile = {
    id: State.profile?.id || uid(),
    nickname, gender, age, height, hometown,
    contact: { type: ct, account: contactAccount },
    photos,
    faceScore: State.profile?.faceScore || 0,
    faceScoreCount: State.profile?.faceScoreCount || 0,
    requirement: { gender: rGender, ageMin, ageMax, heightMin: hMin, heightMax: hMax, hometowns, faceScoreMin: faceMin },
    filledAt: State.profile?.filledAt || new Date().toISOString()
  };
  saveProfile();
  syncProfileToGroup();
  State.screen = 'quiz';
  render();
}

// ============== AI 打分 ==============
async function startFaceScore() {
  const photos = State.tempPhotos.length ? State.tempPhotos : (State.profile?.photos || []);
  if(!photos[0]) { showToast('请先上传照片'); return; }
  const btn = document.getElementById('quiz-start');
  if(btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 打分中...'; }
  try {
    const result = await detectFace(photos[0]);
    const score = Math.round(result.beauty / 10 * 10) / 10;  // 0-100 → 0-10
    State.profile.faceScore = score;
    State.profile.faceAge = result.age;
    State.profile.faceGender = result.gender;
    State.profile.faceScoreCount = (State.profile.faceScoreCount || 0) + 1;
    saveProfile();
    syncProfileToGroup();
    const el = document.getElementById('quiz-result');
    if(el) el.innerHTML = `<div class="text-center py-4"><div class="text-4xl font-bold text-pink-500">${score.toFixed(1)}</div><div class="text-sm text-gray-500 mt-1">AI 评分（原始 ${result.beauty} 分）</div></div>`;
    State.screen = 'result';
    render();
  } catch(err) {
    if(err.message === 'NO_KEY') {
      showToast('AI 打分接口未配置，请联系群主');
      const el = document.getElementById('quiz-result');
      if(el) el.innerHTML = '<p class="text-sm text-red-500">系统打分接口未配置，请联系群主开通</p>';
    } else {
      showToast('打分失败：' + err.message);
    }
    if(btn) { btn.disabled = false; btn.textContent = '🤖 开始系统打分'; }
  }
}

async function startReScore() {
  const remain = 3 - (State.profile?.faceScoreCount || 0);
  if(remain <= 0) { showToast('重评次数已用完'); return; }
  const photos = State.profile?.photos || [];
  if(!photos[0]) { showToast('请先在资料里上传照片'); return; }
  if(!confirm(`确定重新评测？剩余 ${remain} 次机会。`)) return;
  showToast('重新评测中...');
  try {
    const result = await detectFace(photos[0]);
    const score = Math.round(result.beauty / 10 * 10) / 10;
    State.profile.faceScore = score;
    State.profile.faceAge = result.age;
    State.profile.faceGender = result.gender;
    State.profile.faceScoreCount = (State.profile.faceScoreCount || 0) + 1;
    saveProfile();
    syncProfileToGroup();
    showToast('✅ 新分数：' + score.toFixed(1));
    render();
  } catch(err) {
    showToast(err.message === 'NO_KEY' ? 'AI 接口未配置，请联系群主' : '打分失败：' + err.message);
  }
}

// ============== 复制/导入 ==============
function copyMyProfile() {
  if(!State.profile) { showToast('请先填写资料'); return; }
  copyToClipboard(JSON.stringify([State.profile], null, 2));
}
function syncProfileToGroup() {
  if(!State.profile) return;
  const idx = State.groupData.findIndex(p=>p.id===State.profile.id);
  if(idx>=0) State.groupData[idx] = State.profile; else State.groupData.push(State.profile);
  saveGroupData();
}
function importGroupData() {
  const text = document.getElementById('import-text').value.trim();
  if(!text) { showToast('请先粘贴 JSON'); return; }
  try {
    const m = text.match(/\[\s*\{[\s\S]*?\}\s*\]/);
    const json = m ? m[0] : text;
    const arr = JSON.parse(json);
    if(!Array.isArray(arr)) throw new Error('不是数组');
    let added=0, updated=0;
    arr.forEach(p => {
      if(!p.id) p.id = uid();
      const i = State.groupData.findIndex(x=>x.id===p.id);
      if(i>=0){ State.groupData[i]=p; updated++; } else { State.groupData.push(p); added++; }
    });
    saveGroupData();
    showToast(`✅ 导入成功 · 新增 ${added}，更新 ${updated}`);
    document.getElementById('import-text').value='';
  } catch(e) { showToast('❌ JSON 格式不对'); }
}

// ============== 群主认证 ==============
function openLeaderAuth() {
  const firstTime = !State.groupPassword;
  showModal(firstTime ? '首次设置群主密码' : '输入群主密码', firstTime
    ? `<input class="input-field mb-2" id="pw1" type="password" placeholder="设置密码（至少4位）"><input class="input-field mb-3" id="pw2" type="password" placeholder="再次输入确认">`
    : `<input class="input-field mb-3" id="pw1" type="password" placeholder="输入密码">`,
    firstTime ? '设置并进入' : '进入群主模式',
    () => {
      const pw1 = document.getElementById('pw1').value;
      if(firstTime) {
        const pw2 = document.getElementById('pw2').value;
        if(pw1.length < 4) { showToast('密码至少4位'); return; }
        if(pw1 !== pw2) { showToast('两次输入不一致'); return; }
        State.groupPassword = pw1;
        localStorage.setItem(LS_KEYS.password, pw1);
        enterLeader();
      } else {
        if(pw1 === State.groupPassword) enterLeader();
        else showToast('密码错误');
      }
    });
}
function enterLeader() {
  State.isLeader = true;
  render();
}
function showModal(title, bodyHtml, okText, onOk) {
  const m = document.createElement('div');
  m.className = 'modal-mask';
  m.innerHTML = `<div class="modal-box"><h3 class="font-bold text-gray-800 mb-4">${title}</h3>${bodyHtml}<div class="flex gap-2 mt-2"><button class="btn-ghost" data-modal="cancel">取消</button><button class="btn-primary" data-modal="ok">${okText}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('[data-modal="cancel"]').onclick = () => m.remove();
  m.querySelector('[data-modal="ok"]').onclick = () => { onOk(); m.remove(); };
}

// ============== 群主事件 ==============
function bindLeader() {
  document.body.onclick = onLeaderClick;
}
function onLeaderClick(e) {
  const t = e.target.closest('[data-act]');
  if(!t) return;
  const act = t.dataset.act;
  if(act === 'leader-merge') {
    const text = document.getElementById('leader-input').value.trim();
    if(!text) { showToast('请先粘贴 JSON'); return; }
    try {
      const m = text.match(/\[\s*\{[\s\S]*?\}\s*\]/);
      const arr = JSON.parse(m ? m[0] : text);
      let added=0, updated=0;
      arr.forEach(p => {
        if(!p.id) p.id = uid();
        const i = State.groupData.findIndex(x=>x.id===p.id);
        if(i>=0){ State.groupData[i]=p; updated++; } else { State.groupData.push(p); added++; }
      });
      saveGroupData();
      document.getElementById('leader-input').value='';
      showToast(`✅ 合并成功 · 新增 ${added}，更新 ${updated}`);
    } catch(err) { showToast('❌ JSON 格式不对'); }
  } else if(act === 'leader-export') {
    copyToClipboard(JSON.stringify(State.groupData, null, 2));
  } else if(act === 'leader-save-baidu') {
    const k = document.getElementById('l-baidu-key').value.trim();
    const s = document.getElementById('l-baidu-secret').value.trim();
    State.baiduApiKey = k; State.baiduSecretKey = s;
    localStorage.setItem(LS_KEYS.baiduKey, k);
    localStorage.setItem(LS_KEYS.baiduSecret, s);
    showToast('✅ AI 配置已保存');
  } else if(act === 'leader-clear') {
    if(confirm('确定清空群数据？此操作不可恢复。')) { State.groupData=[]; saveGroupData(); showToast('已清空'); }
  } else if(act === 'leader-list') {
    const list = State.groupData.map(p=>`${p.nickname} | ${p.gender==='female'?'女':'男'} | ${p.age}岁 | ${p.height}cm | ${p.hometown} | 颜值${(p.faceScore||0).toFixed(1)}`).join('\n');
    alert(`群内 ${State.groupData.length} 人：\n\n${list}`);
  } else if(act === 'toggle-leader') {
    State.isLeader = false;
  }
  render();
}

// ============== 内部交互代理 ==============
let pendingPhotoIndex = -1;
document.addEventListener('click', function(e) {
  const radio = e.target.closest('[data-radio]');
  if(radio) {
    document.querySelectorAll(`[data-radio="${radio.dataset.radio}"]`).forEach(el=>el.classList.remove('selected'));
    radio.classList.add('selected');
    if(radio.dataset.radio === 'contact') State.tempContactType = radio.dataset.val;
    return;
  }
  const ht = e.target.closest('[data-toggle-ht]');
  if(ht) { ht.classList.toggle('selected'); return; }
  const ph = e.target.closest('[data-photo]');
  if(ph) { pendingPhotoIndex = parseInt(ph.dataset.photo); document.getElementById('photo-input').click(); return; }
  const rm = e.target.closest('[data-rm-photo]');
  if(rm) {
    e.stopPropagation();
    const i = parseInt(rm.dataset.rmPhoto);
    if(!State.tempPhotos.length) State.tempPhotos = [...(State.profile?.photos||[]), '', ''].slice(0,3);
    State.tempPhotos[i] = '';
    const slot = document.querySelector(`[data-photo="${i}"]`);
    if(slot) slot.innerHTML = '<span>+</span>';
    return;
  }
});
document.getElementById('photo-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(!file) return;
  compressImage(file, (dataUrl) => {
    if(!State.tempPhotos.length) State.tempPhotos = [...(State.profile?.photos||[]), '', ''].slice(0,3);
    while(State.tempPhotos.length < 3) State.tempPhotos.push('');
    State.tempPhotos[pendingPhotoIndex] = dataUrl;
    // 只更新照片格子，不重渲染整个表单（避免丢失已填输入）
    const slot = document.querySelector(`[data-photo="${pendingPhotoIndex}"]`);
    if(slot) slot.innerHTML = `<img src="${dataUrl}"><div class="remove" data-rm-photo="${pendingPhotoIndex}">×</div>`;
  });
  e.target.value = '';
});

// ============== 启动 ==============
loadState();
render();
</script>
</body>
</html>
